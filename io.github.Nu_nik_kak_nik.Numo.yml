app-id: io.github.Nu_nik_kak_nik.Numo
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: numo

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  - --socket=wayland

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - /share/man
  - "*.la"
  - "*.a"

modules:
  - name: numo
    builddir : true
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/Nu-nik-kak-nik/Numo.git
        tag: v0.4
        commit: 43d2d0560ba07ac5f512d96fe749f910061c20a8
