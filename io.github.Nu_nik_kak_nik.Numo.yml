app-id: io.github.Nu_nik_kak_nik.Numo
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: numo

finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --device=dri
  - --socket=wayland

cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - /share/man
  - "*.la"
  - "*.a"

modules:
  - name: numo
    builddir : true
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/Nu-nik-kak-nik/Numo.git
        tag: v0.3
        commit: 8386176c6ea7cd2ccbb2a6f0bf0564c32fda5a34
